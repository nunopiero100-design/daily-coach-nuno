services:
  - type: web
    name: daily-coach-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AUTO_APPLY
        value: "false"
      - key: WEEKLY_AUTO_APPLY
        value: "false"