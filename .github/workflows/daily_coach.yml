name: Daily Coach Agent

on:
  schedule:
    # Portugal in summer time (WEST, UTC+1): 07:05 local = 06:05 UTC.
    # In winter this will run at 06:05 local unless you adjust to 07:05 UTC.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply automatic workout changes if AMARELO/VERMELHO?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      target_date:
        description: "Optional date YYYY-MM-DD"
        required: false
        default: ""

jobs:
  daily-coach:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Daily Coach Agent
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AUTO_APPLY: ${{ secrets.AUTO_APPLY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          EXTRA_ARGS="--auto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; then
            EXTRA_ARGS="--apply"
          fi
          if [ -n "${{ inputs.target_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --date ${{ inputs.target_date }}"
          fi
          python daily_coach_agent.py $EXTRA_ARGS --debug --email

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-coach-report
          path: |
            daily_agent_report.txt
            daily_agent_report.json
            last_update_payload.json
            debug_raw_agent.json
          if-no-files-found: ignore
