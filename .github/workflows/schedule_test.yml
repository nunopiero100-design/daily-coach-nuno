name: Schedule Test

on:
  schedule:
    # 13:45 UTC = 14:45 em Lisboa (Horário de Verão)
    # Removida a linha timezone que causava erro
    - cron: "45 13 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print time
        run: |
          echo "Schedule test running"
          date -u
          echo "Event: ${{ github.event_name }}"
